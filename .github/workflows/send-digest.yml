name: Send daily digest
on:
  # 09:00 on the Mac's clock (UTC+05:30), then backups 30, 60 and 120 minutes later: GitHub sometimes
  # delays or skips scheduled runs. Each digest is sent once (mail/sent.json), so the backups only act if needed.
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 4 * * *"
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: send-digest
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        run: python3 .github/send_digest.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Remember it was sent
        run: |
          git config user.name "Knowledge Updater"
          git config user.email "knowledge-updater@users.noreply.github.com"
          git add mail/sent.json
          git diff --cached --quiet || (git commit -m "Digest sent" && git pull --rebase && git push)
